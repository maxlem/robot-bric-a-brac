[env:microspora]
platform = ststm32
board = genericSTM32G431CB
framework = arduino
lib_archive = false
monitor_speed = 250000
monitor_dtr = 1
upload_protocol = dfu
; The SAME51 fork is not needed here, and its STM32 driver predates the
; current STM32duino timer API, so this target uses the released library.
lib_deps =
    symlink://../../third_party/Arduino-FOC
    symlink://../common
    symlink://../../third_party/Arduino-FOC-drivers
extra_scripts = pre:../../tools/gen_motor_params.py

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D HAL_FDCAN_MODULE_ENABLED
    -D LED_BUILTIN=PC6

    ; DRV8316, 6-PWM
    -D PHA_H=PA10
    -D PHA_L=PB15
    -D PHB_H=PA9
    -D PHB_L=PB14
    -D PHC_H=PA8
    -D PHC_L=PB13

    ; three low-side shunts, DRV8316 CSA
    -D ISENS_A=PA0
    -D ISENS_B=PA1
    -D ISENS_C=PA2

    ; driver SPI
    -D DRV_MOSI=PB5_ALT1
    -D DRV_MISO=PB4_ALT1
    -D DRV_SCK=PC10
    -D DRV_CS=PC4

    ; MT6701 magnetic encoder, SSI
    -D ENC_SDO=PA6
    -D ENC_NC=PA7
    -D ENC_CLK=PA5
    -D ENC_CS=PA4

    ; CAN transceiver
    -D CAN_RX=PB8
    -D CAN_TX=PB9
    -D CAN_ENABLE=PC13

    ; bus voltage divider, 4.7k / 47k
    -D VSENS=PB11
    -D VSCALE=11.0

    -D SIMPLEFOC_DEBUG_ENABLED
